W.forEach(w=>{const P=w.p.filter(x=>x[1]!=null);[...w.z].forEach((c,i)=>{if(!(c in ix)){ix[c]=C.length;const a=M[c].split('|');C.push({z:c,t:a[0]||c,k:a[1],u:a[2],py:[],ws:[]})}
 const o=C[ix[c]];let s=P[i]?P[i][0].toLowerCase():'';if(s==='r')s='ér';if(s&&!o.py.includes(s))o.py.push(s);if(!o.ws.includes(w))o.ws.push(w)})});
C.forEach(o=>{const a=o.py.filter(s=>!/^[a-z]+$/.test(s));if(a.length)o.py=a});
const N=C.length;
const RL=[['言','讠','말씀 언','말씀언변','词诉让记试'],['金','钅','쇠 금','쇠금변','铁错'],['食','饣','밥 식','밥식변','饭馆'],['門','门','문 문','문문','间开'],['糸','纟','실 사','실사변','绍绿经红'],['頁','页','머리 혈','머리혈변','题颜头']].map(([t,s,k,n,cs])=>({t,s,k,n,cs:[...cs].map(c=>C[ix[c]])}));
const RK='hanja2_rules_v1';
const rfresh=()=>({queue:shuffle(RL.map((_,i)=>i)),learned:[]});
let RS=null;try{RS=JSON.parse(localStorage.getItem(RK))}catch(e){}
if(!RS||!Array.isArray(RS.queue)||!Array.isArray(RS.learned)||RS.queue.length+RS.learned.length!==RL.length)RS=rfresh();
function rsave(){try{localStorage.setItem(RK,JSON.stringify(RS))}catch(e){}}
let mode='c',cr=0;
const pyOf=o=>{const w=o.ws[0],i=[...w.z].indexOf(o.z),P=w.p.filter(x=>x[1]!=null);return `<span class="t${P[i][1]}">${P[i][0].toLowerCase()}</span>`};
const fresh=()=>({queue:shuffle(C.map((_,i)=>i)),learned:[]});
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.queue)||!Array.isArray(S.learned)||S.queue.length+S.learned.length!==N)S=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let cur=0,topHtml='';
const show=h=>{app.innerHTML=topHtml+h};
function home(){const card=(st,n,t,d,go,rs)=>{const l=st.learned.length,r=st.queue.length;return `<div class="card"><h2>${t}</h2><p class="mut">${d}</p><div class="stat"><b>${r}</b> 남음 · ${l} 외움</div><div class="bar"><i style="width:${l/n*100}%"></i></div><div class="row"><button class="btn pri" data-${go}>${r?(l?'이어서 하기':'시작하기'):'완료 🎉'}</button><button class="btn ghost" data-${rs}>초기화</button></div></div>`};
 app.innerHTML=`<h1>HSK 2 한자 외우기</h1>`+card(S,N,`정자 ${N}자`,'한 글자씩 음훈과 쓰이는 단어를 함께 봐요','go','reset')+card(RS,RL.length,`부수 규칙 ${RL.length}묶음`,'같은 규칙으로 바뀌는 정자·간체를 묶어서 봐요','gor','resetr')}
function play(){mode='c';if(!S.queue.length)return done();
 cur=S.queue[0];const o=C[cur],l=S.learned.length,df=o.t!==o.z;
 topHtml=`<div class="top"><button class="link" data-home>← 홈</button><span>남은 한자 <b>${S.queue.length}</b> / ${N}</span></div><div class="bar"><i style="width:${l/N*100}%"></i></div>`;
 show(`<div class="card fc"><div class="L"><div class="big tc" lang="ko">${o.t}</div><div class="rd">${o.k} <b>${o.u}</b><span class="pyl"><b>${o.py.join(' / ')}</b></span></div></div><div class="R">${df?`<div class="big sc" lang="zh-Hans">${o.z}</div><div class="rd" style="visibility:hidden">${o.k} <b>${o.u}</b><span class="pyl"><b>${o.py.join(' / ')}</b></span></div>`:''}</div></div><div class="act"><div class="row"><button class="btn" data-no>헷갈려요</button><button class="btn pri" data-yes>알아요 ✓</button></div></div><div class="card wl">${o.ws.map((w,i)=>`<div class="wi"><span class="wn">${i+1}.</span><span class="wh" lang="zh-Hans">${hz(w)}</span><span class="wp">${py(w)}</span></div>`).join('')}</div>`);
 window.scrollTo(0,0)}
function playR(){mode='r';if(!RS.queue.length)return done();
 cr=RS.queue[0];const r=RL[cr],l=RS.learned.length,n=RL.length,kk=r.k.split(' ');
 topHtml=`<div class="top"><button class="link" data-home>← 홈</button><span>남은 묶음 <b>${RS.queue.length}</b> / ${n}</span></div><div class="bar"><i style="width:${l/n*100}%"></i></div>`;
 const rd=`${kk[0]} <b>${kk[1]}</b> (${r.n})`;
 show(`<div class="card fc"><div class="L"><div class="big tc" lang="ko">${r.t}</div><div class="rd">${rd}</div></div><div class="R"><div class="big sc" lang="zh-Hans">${r.s}</div><div class="rd" style="visibility:hidden">${rd}</div></div></div><div class="act"><div class="row"><button class="btn" data-no>헷갈려요</button><button class="btn pri" data-yes>알아요 ✓</button></div></div><div class="card wl">${r.cs.map((o,i)=>`<div class="rr"><span class="wn">${i+1}.</span><div class="b"><div class="z tc" lang="ko">${o.t}</div><div class="t">${o.k} <b>${o.u}</b></div></div><span class="wa">→</span><div class="b"><div class="z sc" lang="zh-Hans">${o.z}</div><div class="t">${pyOf(o)}</div></div></div>`).join('')}</div>`);
 window.scrollTo(0,0)}
function advanceR(ok){const q=RS.queue,id=q.shift();
 if(ok)RS.learned.push(id);else{const n=q.length;q.splice(Math.min(n,Math.floor(n/2+Math.random()*(n/2+1))),0,id)}
 rsave();playR()}
function advance(ok){const q=S.queue,id=q.shift();
 if(ok)S.learned.push(id);else{const n=q.length;q.splice(Math.min(n,Math.floor(n/2+Math.random()*(n/2+1))),0,id)}
 save();play()}
function done(){app.innerHTML=`<div class="card center"><div class="hz">🎉</div><h2>모두 외웠어요!</h2><div class="row"><button class="btn pri" data-home>홈으로</button></div></div>`}
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if('go' in d)play();
 else if('gor' in d)playR();
 else if('reset' in d||'resetr' in d){if(d.armed){if('resetr' in d){RS=rfresh();rsave()}else{S=fresh();save()}home()}
  else{d.armed=1;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='초기화'}},3000)}}
 else if('home' in d)home();
 else if('yes' in d)(mode==='r'?advanceR:advance)(true);
 else if('no' in d)(mode==='r'?advanceR:advance)(false)});
home();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script></body></html>
