const base=w=>pkey(w).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function distractor(w){const b=base(w);let best=[],bd=1e9;
 W.forEach(x=>{if(x.z===w.z)return;const d=lev(b,base(x))+2*Math.abs(x.z.length-w.z.length);
  if(d<bd){bd=d;best=[x]}else if(d===bd)best.push(x)});
 return best[Math.floor(Math.random()*best.length)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fresh=()=>({queue:shuffle(W.map((_,i)=>i)),learned:[]});
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||typeof S!=='object')S={};
if(S.hint===undefined)S.hint=true;
if(S.sound===undefined)S.sound=true;
['m1','m2'].forEach(m=>{const s=S[m];if(!s||!Array.isArray(s.queue)||!Array.isArray(s.learned)||s.queue.length+s.learned.length!==W.length)S[m]=fresh()});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let mode=null,phase='ask',T=null,cur=0,topHtml='',ch=[],pick=-1;
const auto=(ms,fn)=>{clearTimeout(T);T=setTimeout(fn,ms)};
const show=h=>{app.innerHTML=topHtml+h};

function zhVoices(){try{return speechSynthesis.getVoices().filter(x=>/^zh/i.test(x.lang))}catch(e){return[]}}
function voice(){const v=zhVoices();return v.find(x=>x.name===S.voice)||v.find(x=>/ting-?ting|婷/i.test(x.name))||v.find(x=>/^zh[-_]CN/i.test(x.lang))||v[0]||null}
function voiceSel(){const vs=zhVoices(),cv=voice();if(!vs.length)return '<p class="mut sm">이 기기에서 중국어 음성을 찾지 못했어요.</p>';
 return `<label class="opt">발음 음성 <select id="vsel">${vs.map(x=>`<option value="${x.name.replace(/"/g,'')}"${cv&&cv.name===x.name?' selected':''}>${x.name} (${x.lang})</option>`).join('')}</select></label>`}
function speak(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';const v=voice();if(v)u.voice=v;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(!mode)home()}}catch(e){}
app.addEventListener('change',e=>{if(e.target.id==='vsel'){S.voice=e.target.value;save();speak('你好，欢迎使用')}});
function home(){clearTimeout(T);try{speechSynthesis.cancel()}catch(e){}mode=null;
 const card=(m,t,d)=>{const s=S[m],l=s.learned.length,r=s.queue.length;
  return `<div class="card"><h2>${t}</h2><p class="mut">${d}</p><div class="stat"><b>${r}</b> 남음 · ${l} 외움</div><div class="bar"><i style="width:${l/W.length*100}%"></i></div><div class="row"><button class="btn pri" data-go="${m}">${r?(l?'이어서 하기':'시작하기'):'완료 🎉'}</button><button class="btn ghost" data-reset="${m}">초기화</button></div></div>`};
 app.innerHTML=`<h1>HSK 2 플래시카드</h1>`+card('m1','방식 1 · 한자 → 뜻','한자를 보고 아는지 확인해요')+card('m2','방식 2 · 병음 → 한자 고르기','병음을 보고 두 한자 중 알맞은 것을 골라요')+`<label class="opt"><input type="checkbox" id="hint" ${S.hint?'checked':''}> 방식 2에서 한국어 뜻 힌트 보기</label><label class="opt"><input type="checkbox" id="snd" ${S.sound?'checked':''}> 문제가 나올 때 발음 자동 재생</label>${voiceSel()}`}

const m1=(r,chk)=>{const w=W[cur];
 return `<div class="card grid" ${r?'':'data-reveal'}><div class="L hz">${hz(w)}</div><div class="R">${r?`<div class="py">${py(w)}</div><p class="mean">${w.k}</p><p class="pos sm">${w.o}</p>`:`<p class="mut sm">한자를 탭하면<br>뜻이 보여요</p>`}</div></div><button class="chk${chk?' on':''}" data-know ${r?'disabled':''}><span class="box"></span>알아요</button>`};
const m2=(res)=>{const w=W[cur];
 const ok=x=>x.z===w.z;
 return `<div class="card grid"><div class="L"><div class="py">${py(w)}</div>${(S.hint||res)?`<p class="mean">${w.k}</p><p class="pos sm">${w.o}</p>`:''}</div><div class="R choices">`+
 ch.map((x,i)=>`<button class="opt2${res?(ok(x)?' right':(i===pick?' wrong':'')):''}" data-pick="${i}" ${res?'disabled':''}>${res?hz(x):x.z}</button>`).join('')+
 `</div></div><button class="chk" data-giveup ${res?'disabled':''}>모르겠어요</button>`};

function play(){clearTimeout(T);phase='ask';const s=S[mode];
 if(!s.queue.length)return done();
 cur=s.queue[0];const w=W[cur],l=s.learned.length;
 topHtml=`<div class="top"><button class="link" data-home>← 홈</button><button class="link" data-speak>🔊 다시 듣기</button><span>남은 단어 <b>${s.queue.length}</b> / ${W.length}</span></div><div class="bar"><i style="width:${l/W.length*100}%"></i></div>`;
 if(S.sound)speak(w.z);if(mode==='m1')show(m1(false));
 else{ch=shuffle([w,distractor(w)]);pick=-1;show(m2(false))}}

function reveal1(){phase='rev';show(m1(true));auto(2000,()=>advance(false))}
function answer2(i){if(phase!=='ask')return;phase='rev';pick=i;const w=W[cur];
 const good=i>=0&&ch[i].z===w.z;
 show(m2(true));auto(2000,()=>advance(good))}

function advance(ok){clearTimeout(T);const s=S[mode],q=s.queue,id=q.shift();
 if(ok)s.learned.push(id);else{const n=q.length;q.splice(Math.min(n,Math.floor(n/2+Math.random()*(n/2+1))),0,id)}
 save();play()}

function done(){clearTimeout(T);
 app.innerHTML=`<div class="card center"><div class="hz">🎉</div><h2>모든 단어를 외웠어요!</h2><p class="mut">${mode==='m1'?'방식 1':'방식 2'} 완료 · ${W.length}개</p><div class="row"><button class="btn pri" data-home>홈으로</button></div></div>`}

app.addEventListener('click',e=>{const t=e.target.closest('button,[data-reveal],#hint,#snd');if(!t)return;
 if(t.dataset.go){mode=t.dataset.go;play()}
 else if(t.dataset.reset){if(t.dataset.armed){S[t.dataset.reset]=fresh();save();home()}
  else{t.dataset.armed=1;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='초기화'}},3000)}}
 else if(t.id==='hint'){S.hint=t.checked;save()}
 else if(t.id==='snd'){S.sound=t.checked;save()}
 else if('speak' in t.dataset){speak(W[cur].z)}
 else if('home' in t.dataset){home()}
 else if('reveal' in t.dataset){if(phase==='ask')reveal1()}
 else if('know' in t.dataset){if(phase!=='ask')return;phase='chk';show(m1(false,true));auto(350,()=>advance(true))}
 else if('pick' in t.dataset){answer2(+t.dataset.pick)}
 else if('giveup' in t.dataset){answer2(-1)}});
home();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script></body></html>
